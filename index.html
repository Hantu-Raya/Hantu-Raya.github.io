    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint. Ids must match src/theme.js.
      (function () {
        var ids = { workbench: "#f5f5f4", compact: "#202020", panorama: "#121410" };
        var t = new URLSearchParams(location.search).get("theme");
        if (!ids[t]) {
          try { t = localStorage.getItem("theme"); } catch (e) { t = null; }
        }
        if (ids[t]) {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", ids[t]);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        This page needs JavaScript. My projects are on
        <a href="https://github.com/Hantu-Raya">GitHub</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
